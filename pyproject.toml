[project]
name = "vcockpit-analytics"
version = "0.1.0"
description = "V-Cockpit analytics pipeline: extraction and statistical analysis of IVI/driver-behavior data from VR driving sessions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "pyyaml==6.0.2",
    "matplotlib==3.9.3",
    "python-dotenv==1.0.0",
    "tqdm==4.67.1",
    "pyhrv==0.4.1",
    "tsfel==0.1.9",
    "biosppy==2.2.2",
    "statsmodels==0.14.4",
    "pylatex==1.4.2",
    "pyarrow>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
package = false
